[workspace]
resolver = "2"
members = [
    "crates/lookwright-core",
    "crates/lookwright-perception",
    "crates/lookwright-renderer",
    "crates/lookwright-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/daikiito-dk/Lookwright"
authors = ["daikiito-dk"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
gltf = "1"
png = "0.17"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

lookwright-core = { path = "crates/lookwright-core" }
lookwright-perception = { path = "crates/lookwright-perception" }
lookwright-renderer = { path = "crates/lookwright-renderer" }

[profile.release]
lto = true
strip = true
